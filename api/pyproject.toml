[project]
name = "sistema-integrado-api"
version = "0.1.0"
description = "Backend FastAPI de la plataforma unificada multi-aplicación HITSS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "beanie>=1.27.0",
  "pymongo>=4.13",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.1",
  "python-jose[cryptography]>=3.3.0",
  "bcrypt>=4.1",
  "python-multipart>=0.0.12",
  "httpx>=0.28.0",
  "apscheduler>=3.10.4",
  "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.4",
  "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Header",
  "fastapi.File",
  "fastapi.Body",
  "fastapi.Path",
  "app.security.deps.requiere_permiso",
]

[tool.ruff.lint.per-file-ignores]
# N818: el ADR-0008 (F2.6) fija el nombre "ErrorDominio" para la excepción base
# de dominio, en español y sin sufijo "Error", igual que el resto del código
# base (símbolos en español). Las subclases sí lo respetan (NoEncontrado no lo
# necesita porque ruff no re-evalúa N818 sobre subclases de una ya reportada).
"app/errors.py" = ["N818"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
